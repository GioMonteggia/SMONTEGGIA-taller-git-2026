
spring.application.name=cs2-api

# Puerto acordado para A1 en la demo (A3 usa 8080, A2 usa 8082)
server.port=8081

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/cs2db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Compañeros consultados por el escenario de POO-09.
# A3 (Luis Tauber) ya está configurado con su API real.
# A2 (César Ramírez) queda pendiente: mientras tanto apunta a este servicio
# para poder verificar el escenario de forma local, igual que antes.
# Todo se puede sobreescribir con entorno, p. ej. COMPANEROS_A2_BASE_URL.
companeros.a2.nombre=A2
companeros.a2.rol=A2
companeros.a2.regla=Validacion de disparo: danio efectivo segun distancia y precision
companeros.a2.base-url=http://localhost:8081
companeros.a2.openapi-url=${companeros.a2.base-url}/v3/api-docs
companeros.a2.validar-path=/api/reglas/disparo
companeros.a2.envio=body
companeros.a2.timeout-ms=3000

companeros.a3.nombre=Luis Tauber
companeros.a3.rol=A3
companeros.a3.regla=Un arma de fuego necesita munición para disparar y una granada no se puede lanzar dos veces.
companeros.a3.base-url=http://localhost:8080
companeros.a3.openapi-url=${companeros.a3.base-url}/v3/api-docs
companeros.a3.validar-path=/api/reglas/combate
companeros.a3.envio=body
companeros.a3.timeout-ms=3000
